<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bulk Download Manager</title>
<style>
:root {
  --bg: #0d0d12;
  --s1: #16161e;
  --s2: #1e1e28;
  --s3: #252532;
  --border: rgba(255,255,255,0.08);
  --text: #ededf5;
  --muted: #7777a0;
  --accent: #7c6fff;
  --green: #25d87a;
  --amber: #f0a500;
  --red: #f05858;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif}

/* HEADER */
header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);display:flex;align-items:center;justify-content:center}
.logo svg{width:16px;height:16px;stroke:white;fill:none;stroke-width:2.5}
header h1{font-size:15px;font-weight:600}
#hdr-info{margin-left:auto;font-size:12px;color:var(--muted)}

/* LAYOUT */
main{max-width:620px;margin:0 auto;padding:1.25rem 1rem}

/* INPUT SECTION */
.card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:1.1rem;margin-bottom:12px}
.card-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
textarea{width:100%;height:150px;background:var(--s2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:11px 13px;font-size:12.5px;font-family:'Cascadia Code',Consolas,monospace;resize:vertical;line-height:1.65}
textarea:focus{outline:none;border-color:var(--accent)}
textarea::placeholder{color:var(--muted)}
.btn-row{display:flex;gap:8px;margin-top:10px;align-items:center;flex-wrap:wrap}
button{padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--text);font-size:13.5px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:background .15s}
button:hover{background:var(--s2)}
button.primary{background:var(--accent);border-color:transparent;color:#fff}
button.primary:hover{background:#6a5ee0}
button:disabled{opacity:.35;cursor:not-allowed;pointer-events:none}
.err{font-size:12px;color:var(--red);margin-top:5px;min-height:15px}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:.9rem;text-align:center}
.stat-n{font-size:24px;font-weight:800;letter-spacing:-.02em}
.stat-l{font-size:11px;color:var(--muted);margin-top:2px}
#sv-done{color:var(--green)}
#sv-left{color:var(--accent)}

/* LINK LIST */
#links-panel{display:none}
.panel-header{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.links-scroll{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow-y:auto;padding-right:2px}
.links-scroll::-webkit-scrollbar{width:3px}
.links-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}

/* LINK ITEM */
.link-item{
  display:flex;align-items:center;gap:10px;
  background:var(--s1);border:1px solid var(--border);
  border-radius:10px;padding:10px 12px;
  cursor:pointer;transition:border-color .15s,background .15s;
  position:relative;
}
.link-item:hover{background:var(--s2);border-color:rgba(124,111,255,.4)}
.link-item.active{border-color:var(--accent);background:rgba(124,111,255,.08)}
.link-item.done{border-color:rgba(37,216,122,.25);background:rgba(37,216,122,.05)}
.link-item.downloading{border-color:var(--amber);background:rgba(240,165,0,.07)}

/* Number badge */
.num{
  min-width:28px;height:28px;border-radius:50%;
  background:var(--s3);border:1px solid var(--border);
  display:flex;align-items:center;justify-content:center;
  font-size:11px;font-weight:700;color:var(--muted);flex-shrink:0;
}
.link-item.active .num{background:var(--accent);border-color:transparent;color:#fff}
.link-item.done .num{background:var(--green);border-color:transparent;color:#0a2010}
.link-item.downloading .num{background:var(--amber);border-color:transparent;color:#2a1800}

.link-info{flex:1;min-width:0}
.link-url{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.link-status{font-size:11px;font-weight:600;margin-top:2px}
.link-item.active .link-status{color:var(--accent)}
.link-item.done .link-status{color:var(--green)}
.link-item.downloading .link-status{color:var(--amber)}
.link-item:not(.active):not(.done):not(.downloading) .link-status{color:var(--muted)}

/* Action button on item */
.item-btn{
  padding:6px 12px;border-radius:6px;font-size:12px;font-weight:600;
  border:none;cursor:pointer;flex-shrink:0;white-space:nowrap;
}
.item-btn.dl{background:var(--green);color:#0a2010}
.item-btn.dl:hover{background:#1fc068}
.item-btn.open{background:var(--accent);color:#fff}
.item-btn.open:hover{background:#6a5ee0}

/* Countdown overlay on item */
.item-countdown{
  position:absolute;right:12px;top:50%;transform:translateY(-50%);
  font-size:20px;font-weight:800;color:var(--accent);
  min-width:30px;text-align:center;
}

/* Done banner */
.done-banner{background:rgba(37,216,122,.1);border:1px solid rgba(37,216,122,.3);border-radius:12px;padding:1.25rem;text-align:center;margin-bottom:12px}
.done-banner .big{font-size:18px;font-weight:700;color:var(--green)}
.done-banner .sub{font-size:13px;color:var(--muted);margin-top:3px}

@media(max-width:420px){
  .stats{grid-template-columns:repeat(3,1fr)}
  .stat-n{font-size:20px}
}
</style>
</head>
<body>
<header>
  <div class="logo">
    <svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
  </div>
  <h1>Bulk Download Manager</h1>
  <span id="hdr-info"></span>
</header>

<main>
  <!-- Input -->
  <div class="card" id="input-card">
    <div class="card-label">Links paste karo (ek line = ek link, max 150)</div>
    <textarea id="links-input" placeholder="https://example.com/file1.zip&#10;https://example.com/file2.zip&#10;https://example.com/file3.zip"></textarea>
    <div class="err" id="err-msg"></div>
    <div class="btn-row">
      <button class="primary" id="start-btn" onclick="startQueue()">▶ Start</button>
      <button id="reset-btn" onclick="resetAll()" disabled>↺ Reset</button>
      <span style="font-size:12px;color:var(--muted);margin-left:auto" id="count-lbl"></span>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats-row" style="display:none">
    <div class="stat"><div class="stat-n" id="sv-total">0</div><div class="stat-l">Total</div></div>
    <div class="stat"><div class="stat-n" id="sv-done">0</div><div class="stat-l">Done</div></div>
    <div class="stat"><div class="stat-n" id="sv-left">0</div><div class="stat-l">Baaki</div></div>
  </div>

  <!-- Done banner -->
  <div id="done-slot"></div>

  <!-- Links panel -->
  <div id="links-panel">
    <div class="panel-header">Queue — kisi pe bhi click karke download karo</div>
    <div class="links-scroll" id="links-list"></div>
  </div>
</main>

<script>
let links = [], done = new Set(), active = -1;
let cdTimer = null, shiftTimer = null;

const $ = id => document.getElementById(id);

$('links-input').addEventListener('input', () => {
  const n = parseLinks().length;
  $('count-lbl').textContent = n ? n + ' links' : '';
  $('err-msg').textContent = '';
});

function parseLinks() {
  return $('links-input').value.split('\n')
    .map(l => l.trim()).filter(l => /^https?:\/\//i.test(l));
}

function startQueue() {
  const arr = parseLinks();
  if (!arr.length) { $('err-msg').textContent = 'Koi valid link nahi mila.'; return; }
  if (arr.length > 150) { $('err-msg').textContent = 'Max 150 links allowed.'; return; }
  links = arr;
  $('start-btn').disabled = true;
  $('reset-btn').disabled = false;
  $('links-input').disabled = true;
  $('stats-row').style.display = 'grid';
  $('links-panel').style.display = 'block';
  $('hdr-info').textContent = links.length + ' links';
  updateStats();
  buildList();
  activateLink(0);
}

function buildList() {
  $('links-list').innerHTML = links.map((l, i) => `
    <div class="link-item" id="li-${i}" onclick="onItemClick(${i})">
      <div class="num" id="num-${i}">${i + 1}</div>
      <div class="link-info">
        <div class="link-url">${l}</div>
        <div class="link-status" id="ls-${i}">Tap karke open karo</div>
      </div>
      <div id="ia-${i}"></div>
    </div>
  `).join('');
}

function updateStats() {
  $('sv-total').textContent = links.length;
  $('sv-done').textContent = done.size;
  $('sv-left').textContent = links.length - done.size;
}

// Called when user taps any link item
function onItemClick(i) {
  if (done.has(i)) return; // already done, ignore
  activateLink(i);
}

function activateLink(i) {
  clearTimers();
  // deactivate previous
  if (active >= 0 && active !== i) {
    const prev = $('li-' + active);
    if (prev && !done.has(active)) {
      prev.className = 'link-item';
      $('ls-' + active).textContent = 'Tap karke open karo';
      $('ia-' + active).innerHTML = '';
    }
  }
  active = i;
  const item = $('li-' + i);
  item.className = 'link-item active';
  $('ia-' + i).innerHTML = '';

  // Open the link in new tab
  try { window.open(links[i], '_blank', 'noopener'); } catch(e) {}

  // Show countdown 5 sec then show download button
  let sec = 5;
  $('ls-' + i).textContent = 'Tab mein khul raha hai...';
  $('ia-' + i).innerHTML = `<div class="item-countdown" id="cd-${i}">${sec}</div>`;

  cdTimer = setInterval(() => {
    sec--;
    const cd = $('cd-' + i);
    if (cd) cd.textContent = sec;
    if (sec <= 0) {
      clearInterval(cdTimer);
      // Show download button
      item.className = 'link-item downloading';
      $('ls-' + i).textContent = 'Download button tab mein hai — yahan bhi karo:';
      $('ia-' + i).innerHTML = `<button class="item-btn dl" onclick="doDownload(${i}, event)">⬇ Download</button>`;
    }
  }, 1000);
}

function doDownload(i, e) {
  e && e.stopPropagation();
  // trigger download
  const a = document.createElement('a');
  a.href = links[i]; a.download = ''; a.target = '_blank';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);

  // mark done
  done.add(i);
  const item = $('li-' + i);
  item.className = 'link-item done';
  $('ls-' + i).textContent = 'Done ✓';
  $('ia-' + i).innerHTML = '';
  updateStats();

  // After 5 sec auto shift to next
  const next = findNext(i);
  if (next !== -1) {
    $('ls-' + i).textContent = 'Done ✓ — 5 sec mein agla khulega';
    shiftTimer = setTimeout(() => {
      activateLink(next);
      // scroll next into view
      $('li-' + next)?.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }, 5000);
  } else {
    // All done
    showDone();
  }
}

function findNext(from) {
  for (let i = from + 1; i < links.length; i++) {
    if (!done.has(i)) return i;
  }
  return -1;
}

function showDone() {
  $('done-slot').innerHTML = `
    <div class="done-banner">
      <div class="big">🎉 Sab complete!</div>
      <div class="sub">${links.length} links process ho gaye</div>
    </div>`;
}

function clearTimers() {
  clearInterval(cdTimer);
  clearTimeout(shiftTimer);
}

function resetAll() {
  clearTimers();
  links = []; done = new Set(); active = -1;
  $('links-input').disabled = false;
  $('links-input').value = '';
  $('start-btn').disabled = false;
  $('reset-btn').disabled = true;
  $('stats-row').style.display = 'none';
  $('links-panel').style.display = 'none';
  $('links-list').innerHTML = '';
  $('count-lbl').textContent = '';
  $('err-msg').textContent = '';
  $('hdr-info').textContent = '';
  $('done-slot').innerHTML = '';
}
</script>
</body>
</html>
